    <circle cx="22" cy="19" r="5" fill="#7CFFB2"/>
    <text x="40" y="25" fill="#9EB1BE" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="2.2">LOCAL FILE FORENSICS</text>

    <text x="0" y="118" fill="#F7FAFC" font-size="86" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="-3">DUPLICATE</text>
    <text x="0" y="202" fill="url(#mintLine)" font-size="86" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="-3">HUNTER</text>

    <text x="2" y="254" fill="#A9BAC5" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif">Exact duplicate discovery. Local. Verifiable. Reversible.</text>
    <text x="2" y="292" fill="#6F8492" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Size → 64 KiB prefix digest → full SHA-256 confirmation</text>

    <g transform="translate(0 342)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <rect width="164" height="44" rx="12" fill="#111B22" stroke="#294038"/>
        <path d="M18 22l7 7 13-15" fill="none" stroke="#7CFFB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="28" fill="#DCE7ED" font-size="15" font-weight="650">SHA-256 verified</text>
      </g>
      <g transform="translate(180 0)">
        <rect width="150" height="44" rx="12" fill="#111B22" stroke="#294038"/>
        <path d="M20 14v16M13 22h14" stroke="#22D3C5" stroke-width="2.5" stroke-linecap="round"/>
        <text x="46" y="28" fill="#DCE7ED" font-size="15" font-weight="650">Preview first</text>
      </g>
      <g transform="translate(346 0)">
        <rect width="132" height="44" rx="12" fill="#111B22" stroke="#4A3F22"/>
        <circle cx="22" cy="22" r="8" fill="none" stroke="#F2C14E" stroke-width="2"/>
        <path d="M17 22h10M22 17v10" stroke="#F2C14E" stroke-width="1.7"/>
        <text x="45" y="28" fill="#DCE7ED" font-size="15" font-weight="650">Local only</text>
      </g>
    </g>

    <g transform="translate(0 472)">
      <text x="0" y="0" fill="#F7FAFC" font-size="24" font-family="Tahoma,Segoe UI,Arial,sans-serif" font-weight="700">رضوان عبدالهادي</text>
      <text x="0" y="31" fill="#718592" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing=".8">A RADWAN ABD ALHADY PROJECT</text>
    </g>
