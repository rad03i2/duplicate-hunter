  <g opacity=".7">
    <path d="M1420 615h92" stroke="#31434D"/>
    <circle cx="1518" cy="615" r="4" fill="#7CFFB2"/>
    <text x="1290" y="622" fill="#5F7480" font-size="12" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="1.4">VERIFY • PREVIEW • QUARANTINE</text>
