<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Duplicate Hunter project cover</title>
  <desc id="desc">Precision file forensics identity for Duplicate Hunter by Radwan Abd alhady Ahmed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C10"/>
      <stop offset="0.55" stop-color="#0D141B"/>
      <stop offset="1" stop-color="#101A22"/>
    </linearGradient>
    <linearGradient id="mintLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#22D3C5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15212B" stop-opacity=".98"/>
      <stop offset="1" stop-color="#0C1319" stop-opacity=".98"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7CFFB2" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7CFFB2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#25313B" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)" opacity=".38"/>
  <circle cx="1295" cy="190" r="320" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="145" cy="690" r="220" fill="#22D3C5" opacity=".045"/>

  <g opacity=".28">
    <path d="M78 86H344" stroke="url(#mintLine)" stroke-width="2"/>
    <path d="M78 94H215" stroke="#F2C14E" stroke-width="2"/>
    <circle cx="78" cy="86" r="5" fill="#7CFFB2"/>
  </g>

  <g transform="translate(92 118)">
