      <text x="142" y="332" fill="#7CFFB2" font-size="17" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">a4f91c…  SHA-256</text>
    </g>

    <g transform="translate(114 0)">
      <path d="M112 82h210l62 62v256a26 26 0 0 1-26 26H112a26 26 0 0 1-26-26V108a26 26 0 0 1 26-26z" fill="#111C23" stroke="#3A515C" stroke-width="2"/>
      <path d="M322 82v50a20 20 0 0 0 20 20h42" fill="#1D2B34" stroke="#3A515C" stroke-width="2"/>
      <rect x="122" y="194" width="180" height="10" rx="5" fill="#3A505B"/>
      <rect x="122" y="222" width="218" height="10" rx="5" fill="#30444F"/>
      <rect x="122" y="250" width="152" height="10" rx="5" fill="#30444F"/>
      <rect x="122" y="304" width="220" height="44" rx="12" fill="#10201F" stroke="#3F7159"/>
      <text x="142" y="332" fill="#7CFFB2" font-size="17" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">a4f91c…  SHA-256</text>
    </g>

    <g transform="translate(84 392)">
      <rect x="0" y="0" width="410" height="116" rx="24" fill="#10191F" stroke="#2B424A"/>
      <circle cx="54" cy="58" r="25" fill="#122A26" stroke="#7CFFB2" stroke-width="2"/>
      <path d="M43 58l8 8 16-18" fill="none" stroke="#7CFFB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="51" fill="#F4F8FA" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">BYTE-IDENTICAL PAIR</text>
      <text x="96" y="78" fill="#8297A3" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">one copy kept · extras quarantined on request</text>
      <rect x="360" y="20" width="30" height="76" rx="15" fill="#0C151A" stroke="#4A3F22"/>
      <circle cx="375" cy="41" r="6" fill="#F2C14E"/>
      <circle cx="375" cy="60" r="6" fill="#22D3C5"/>
      <circle cx="375" cy="79" r="6" fill="#7CFFB2"/>
