[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "duplicate-hunter"
version = "1.0.0"
description = "Safe, local duplicate-file finder with hashing, reports, and quarantine workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
keywords = ["duplicates", "files", "sha256", "cleanup", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.scripts]
duplicate-hunter = "duplicate_hunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicate_hunter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
